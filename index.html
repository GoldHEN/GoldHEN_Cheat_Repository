  <script>
    const games = JSON.parse(document.getElementById("games-data").textContent);
    const search = document.getElementById("game-search");
    const list = document.getElementById("game-list");
    const count = document.getElementById("result-count");

    function renderGames() {
      const query = search.value.trim().toLocaleLowerCase();
      const matches = games.filter(game =>
        !query || game.some(value => value.toLocaleLowerCase().includes(query))
      );
      const fragment = document.createDocumentFragment();

      for (const [name, titleId, version, format, process] of matches) {
        const row = document.createElement("tr");
        for (const [index, value] of [name, titleId, version, format, process].entries()) {
          const cell = document.createElement("td");
          if (index > 0) {
            const code = document.createElement("code");
            code.textContent = value;
            cell.append(code);
          } else {
            cell.textContent = value;
          }
          row.append(cell);
        }
        fragment.append(row);
      }

      list.replaceChildren(fragment);
      count.textContent = `Showing ${matches.length.toLocaleString()} of ${games.length.toLocaleString()} game/version entries`;
    }

    search.addEventListener("input", renderGames);
    renderGames();
  </script>
